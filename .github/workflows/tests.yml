name: tests

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  server-tests:
    name: server unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install --disable-pip-version-check rns==1.1.3 lxmf==0.9.4 msgpack wasmtime==50.0.1
      - name: Run no-mesh server suites
        run: |
          python tests/test_moderation.py
          python tests/test_presence.py
          python tests/test_streams.py
          python tests/test_blobs_site.py
          python tests/test_micron_render.py
          python tests/test_applet_bridge.py
          python tests/test_command.py
          python tests/test_term.py
          python tests/test_roles.py
          python tests/test_admin.py
          python tests/test_icons_geom.py
          python tests/test_join.py
          python tests/test_phase6.py
          python tests/test_u3.py
          python tests/test_dms.py
          python tests/test_invite.py

  client-tests:
    # Requires real Widget behaviour; runs headless on linux with the
    # KIVY_GL_BACKEND=mock / SDL_VIDEODRIVER=dummy defaults the suites
    # set themselves. Skipped everywhere Kivy cannot create a window.
    name: kivy client tests (ubuntu)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pycairo builds from source when no wheel matches the resolver's
      # choice, and the sdist meson build needs the system cairo headers.
      # Without libcairo2-dev + pkg-config this job dies at pip install
      # (github run 42715864910, "Dependency cairo not found").
      - name: Install system cairo headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev pkg-config
      - name: Install client deps
        run: python -m pip install --disable-pip-version-check "kivy[base]==2.3.1" "kivymd==2.0.0" pillow rns==1.1.3 lxmf==0.9.4 msgpack
      # github run 42720783680: after the cairo fix, kivy 2.3.1 imports fine,
      # but the suites open a real Window ("Provider: sdl2 ... Couldn't
      # connect to X server", exit 102) and the mtdev input provider wants
      # libmtdev.so.1. Headless runners get a virtual display plus the lib.
      - name: Install xvfb and mtdev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libmtdev1
      - name: Import smoke test
        # Same display law as the suites: importing kivy_client initializes
        # the kivy window manager and the sdl2 provider needs a display
        # (github run 42926045160: "Couldn't connect to X server", exit 102).
        run: xvfb-run -a python -c "import kivy_client; assert kivy_client.KIVY and kivy_client.KIVYMD, 'client import requires kivy+kivymd'"
      - name: Run client suites under a virtual display
        run: |
          xvfb-run -a python tests/test_attachments.py
          xvfb-run -a python tests/test_embed_features.py
          xvfb-run -a python tests/test_embed_layout.py
          xvfb-run -a python tests/test_pfp_crop.py
          xvfb-run -a python tests/test_fullscreen_parent.py

  integ-test:
    name: integration mesh (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install --disable-pip-version-check rns==1.1.3 lxmf==0.9.4 msgpack
      - name: Boot a guild and run the integ suite
        run: python tests/integ_test.py
