name: Build sHades Kivy client

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"

jobs:
  lint-and-test:
    name: lint + import test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install system deps
        run: |
          sudo apt-get update -y
          # libopus0: VoiceCodec's discovery reads the system libopus
          # via find_library on Linux; the headless runner has none by
          # default, and the voice suites construct a real codec.
          sudo apt-get install -y -qq libcairo2-dev pkg-config libmtdev1 xvfb libopus0 portaudio19-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          python -m py_compile main.py kivy_client.py setup_sHades.py sHades.py ui_scale.py applet_bridge.py app_attachments.py app_channels.py app_menus.py app_settings.py app_site.py app_stream.py client_util.py client_widgets.py store.py guild_api.py ui_fx.py ui_geom.py ui_theme.py updater.py update_run.py offline_store.py profile_card.py dms.py micron.py invite.py recovery.py qr_tools.py mesh_ui.py
          python -m flake8 main.py kivy_client.py setup_sHades.py sHades.py ui_scale.py applet_bridge.py app_attachments.py app_channels.py app_menus.py app_settings.py app_site.py app_stream.py client_util.py client_widgets.py store.py guild_api.py ui_fx.py ui_geom.py ui_theme.py updater.py update_run.py offline_store.py profile_card.py dms.py micron.py invite.py recovery.py qr_tools.py mesh_ui.py
      - name: Import smoke test (headless)
        run: xvfb-run -a python -c "import kivy_client; app = kivy_client.sHadesClientApp(); app.build(); print('client builds OK')"
      - name: Test suite
        run: |
          for t in tests/test_*.py; do
            echo "::group::$t"
            xvfb-run -a python "$t" || { echo "::error::$t failed"; exit 1; }
            echo "::endgroup::"
          done

  build-linux:
    name: build Linux (PyInstaller onefile)
    needs: lint-and-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install system deps
        run: |
          sudo apt-get update -y
          # portaudio19-dev: pyaudio (desktop MicSource/SpeakerSink in
          # requirements.txt) has no prebuilt wheel for this Python on
          # Linux; pip builds it and needs the portaudio headers.
          sudo apt-get install -y -qq libcairo2-dev pkg-config libmtdev1 xvfb portaudio19-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0,<7.0"
      - name: Build onefile binary
        run: |
          xvfb-run -a \
          pyinstaller --onefile --name sHades-client kivy_client.py \
            --hidden-import=RNS \
            --hidden-import=LXMF \
            --hidden-import=RNS.vendor \
            --hidden-import=RNS.vendor.umsgpack \
            --hidden-import=ui_scale \
            --hidden-import=kivymd.icon_definitions \
            --hidden-import=ui_fx \
            --collect-all=RNS \
            --collect-all=LXMF \
            --collect-all=wasmtime \
            --collect-all=kivymd \
            --add-data "kv_md.kv:." \
            --add-data "fonts:fonts" \
            --distpath dist/linux
      - name: Publish artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: sHades-client-linux
          path: dist/linux/sHades-client
          retention-days: 7

  build-windows:
    name: build Windows (PyInstaller onefile)
    needs: lint-and-test
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0,<7.0"
      - name: Build onefile binary
        env:
          KIVY_GL_BACKEND: mock
          KIVY_NO_ARGS: '1'
        # --collect-all=wasmtime: the package ships a raw data DLL (wasmtime
        # layout: wasmtime/win32-x86_64/_wasmtime.dll) that plain analysis
        # never bundles; local mirror of this exact command produced an exe
        # with ZERO wasmtime entries in Analysis/EXE TOCs. Without it the
        # frozen client silently drops the micron applet bridge.
        run: pyinstaller --onefile --name sHades-client.exe kivy_client.py --hidden-import=RNS --hidden-import=LXMF --hidden-import=RNS.vendor --hidden-import=RNS.vendor.umsgpack --hidden-import=ui_scale --hidden-import=kivymd.icon_definitions --hidden-import=ui_fx --collect-all=RNS --collect-all=LXMF --collect-all=wasmtime --collect-all=kivymd --add-data "kv_md.kv;." --add-data "fonts;fonts" --distpath dist/windows
      - name: Publish artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: sHades-client-windows
          path: dist/windows/sHades-client.exe
          retention-days: 7

  build-android:
    name: build Android debug APK (buildozer)
    needs: lint-and-test
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
      - name: Set up Java 17 (required by Android Gradle plugin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Clean buildozer cache
        run: |
          rm -rf ~/.buildozer
      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y -qq \
            git zip unzip python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev cmake ninja-build
      - name: Install buildozer + deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt buildozer==1.5.0 cython
      - name: Install gettext + autopoint (needed by liblzma recipe)
        # p4a's liblzma recipe runs `autoreconf -vif` on the xz sources;
        # xz's configure.ac uses gettext, so autoreconf invokes autopoint.
        # GitHub's ubuntu runner image does NOT ship autopoint ("Can't
        # exec \"autopoint\": No such file or directory" -- android job
        # 132549200820, v0.5 first attempt). On jammy autopoint is its OWN
        # package, merely "suggested" by gettext (receipt: job
        # 132552679102 -- gettext 868 kB installed, autopoint still exec
        # -fail) -- so name it explicitly.
        run: sudo apt-get update -qq && sudo apt-get install -y gettext autopoint
      - name: Prefetch p4a and un-hardcode bzlib=no
        # p4a's python3 recipe hardcodes 'ac_cv_header_bzlib_h=no' into
        # the cross-configure args, so the android target NEVER builds
        # the _bz2 stdlib extension even when the libbz2 recipe is named
        # (receipt: android job 132555356425, run 43630245037 -- the log
        # prints 'Activating flags for libbz2' yet the configure args
        # still carry ac_cv_header_bzlib_h=no, the probe answers
        # '(cached) no', _bz2 lands missing, while _lzma builds fine
        # because its probe has no such hardcode). This contradicts the
        # recipe's own opt_depends docstring. Buildozer only clones p4a
        # when the dir is absent (buildozer/targets/android.py
        # `if not file_exists(p4a_dir)`), so prefetch the clone, delete
        # the single offending line, and buildozer adopts it as-is.
        run: |
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform"
          git clone -b develop --single-branch \
            https://github.com/kivy/python-for-android.git "$P4A_DIR/python-for-android"
          # Pinned (REVIEW.md "still to validate", closed 2026-11-20):
          # develop HEAD 9562d1b4f306d0af1e76991c711114010dea4152 is the
          # exact revision that built APK artifact 14621601277
          # (sHades-client-android, sha256 3b1ea2818177...225b,
          # run 44717730161), which booted clean on the arm64 phone
          # with the IME meter live and the composer lift working.
          # Both recipe edits below are guarded by grep against this
          # revision; a future unpin must re-trigger them by hand.
          P4A_PIN=9562d1b4f306d0af1e76991c711114010dea4152
          # Re-attach the branch AT the pin instead of detaching HEAD:
          # buildozer 1.5.0 (targets/android.py, lines ~669-676) runs
          # 'git branch -vv', takes split()[1], and RMTREES the whole
          # p4a dir unless the current branch name equals p4a.branch
          # ("Detected old url/branch (...), deleting..." -- receipt:
          # pin run 44720664496, log line 707). A detached HEAD from
          # 'git checkout <pin>' reads '(HEAD detached at 9562d1b)' and
          # the rmtree discards every prefetch edit made after the
          # checkout (the bzlib recipe fix died with it twice). With
          # 'checkout -B develop <pin>' the branch line reads
          # 'develop', the dir is kept, and the tree still sits at the
          # pin exactly as the rev-parse guard below requires.
          git -C "$P4A_DIR/python-for-android" checkout -q -B develop "$P4A_PIN"
          if [ "$(git -C "$P4A_DIR/python-for-android" rev-parse HEAD)" != "$P4A_PIN" ]; then
            echo "::error::p4a pinned revision check-out failed"; exit 1
          fi
          echo "p4a pinned to $P4A_PIN (the revision behind 0.36.15)"
          RECIPE="$P4A_DIR/python-for-android/pythonforandroid/recipes/python3/__init__.py"
          # BZ2 WAR, round two (receipts: run 44717730161 target probe
          # "extension module _bz2... yes" vs run 44720664496
          # "checking for bzlib.h... (cached) no" -> "_bz2... missing",
          # SAME p4a commit 9562d1b, 20 minutes apart; on-device error
          # ModuleNotFoundError: _bz2 via RNS/Buffer -> bz2 at boot,
          # tay's screenshot 2026-11-20). Deleting the
          # ac_cv_header_bzlib_h=no hardcode (the round-one fix) makes
          # the probe live, but CPython's configure can serve the
          # header answer from an autoconf cache seeded by an earlier
          # pass in the same build dir, before the libbz2 recipe
          # product reaches the include path. Deterministic repair:
          # pin the cache variables to YES at the exact site the
          # hardcode sat; command-line cache vars are authoritative in
          # every pass and every recipe order.
          sed -i 's/ac_cv_header_bzlib_h=no/ac_cv_header_bzlib_h=yes/' "$RECIPE"
          sed -i "s/'ac_cv_header_sys_eventfd_h=no',/'ac_cv_header_sys_eventfd_h=no',\n        'ac_cv_lib_bz2_BZ2_bzCompress=yes',/" "$RECIPE"
          if ! grep -q "ac_cv_header_bzlib_h=yes" "$RECIPE" || ! grep -q "ac_cv_lib_bz2_BZ2_bzCompress=yes" "$RECIPE"; then
            echo "::error::bzlib cache-var injection failed"; exit 1
          fi
          if grep -q "ac_cv_header_bzlib_h=no" "$RECIPE"; then
            echo "::error::bzlib no-form hardcode still present"; exit 1
          fi
          echo "bzlib cache vars pinned to yes: $RECIPE"
          # materialyoucolor recipe drift: p4a develop pins
          # recipes/materialyoucolor at version 2.0.10 (GitHub-release
          # sdist). KivyMD 2.0.0 requires >=3.0.3 (<4), but p4a installs
          # requirements with --no-deps, so kivymd's constraint never
          # corrects the recipe pin -- the bundle ships the 2.x layout
          # and kivymd dies on-device at materialyoucolor.dynamiccolor
          # .color_spec (which only exists in 3.x). Phone receipt: crash
          # statement embedded by the MDApp stub, kivy_client.py:1673.
          # v3.0.4 release asset URL verified live (same download path).
          MYC_RECIPE="$P4A_DIR/python-for-android/pythonforandroid/recipes/materialyoucolor/__init__.py"
          sed -i 's/version = "2.0.10"/version = "3.0.4"/' "$MYC_RECIPE"
          if ! grep -q 'version = "3.0.4"' "$MYC_RECIPE"; then
            echo "::error::materialyoucolor recipe version not updated"; exit 1
          fi
          echo "materialyoucolor recipe pinned to 3.0.4: $MYC_RECIPE"
      - name: Build debug APK
        # p4a version selection: Recipe.version reads VERSION_<name> env
        # (pythonforandroid/recipe.py). Kivy 2.3.1 supports python 3.8-3.13
        # while p4a develop's python3/hostpython3 recipe defaults jumped to
        # 3.14.2 -- so the build selects 3.11.5 (recipe-patched for it)
        # without pinning the whole toolchain to a stale commit.
        env:
          VERSION_python3: 3.11.5
          VERSION_hostpython3: 3.11.5
        run: |
          set -o pipefail
          # tee drains stdout so the step log would stay silent for the
          # whole 13-minute build; a failure would leave nothing in this
          # job's log. Capture the exit and print the build's own tail,
          # then let the gates still run as before.
          if buildozer android debug 2>&1 | tee buildlog.txt > /dev/null; then
            echo "buildozer exited 0"
          else
            BUILD_EXIT=$?
            echo "::error::buildozer exited $BUILD_EXIT; last 300 lines follow"
            tail -300 buildlog.txt
            exit $BUILD_EXIT
          fi
          # BZ2 gate, fail closed: this build's own log must carry a
          # target-python _bz2 probe answered yes (live or cached), and
          # no missing verdict may appear anywhere. A build that ships
          # without the _bz2 extension boots dead (RNS/Buffer imports
          # bz2 at module level); refuse the APK instead.
          if grep -q "extension module _bz2... missing" buildlog.txt; then
            echo "::error::python probed _bz2 as MISSING in this build"
            tail -60 buildlog.txt; exit 1
          fi
          PROBES=$(grep -c "extension module _bz2... yes" buildlog.txt)
          if [ "$PROBES" -lt 2 ]; then
            echo "::error::_bz2 probe answered yes fewer than twice (host + target): $PROBES"
            tail -60 buildlog.txt; exit 1
          fi
          echo "bz2 gate: _bz2 probe yes count = $PROBES"
      - name: Publish APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: sHades-client-android
          path: bin/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: sHades-buildlog-android
          path: buildlog.txt
          retention-days: 7

  server-bundle:
    name: package server bundle (P11)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
      - name: Bundle server source + sha256
        run: |
          set -e
          V=$(grep -E '^version = ' buildozer.spec | sed 's/version = //')
          git archive --format=tar.gz -o "sHades-server-$V.tar.gz" HEAD
          sha256sum "sHades-server-$V.tar.gz" > "sHades-server-$V.sha256"
          cat "sHades-server-$V.sha256"
      - name: Publish bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: sHades-server-bundle
          path: |
            sHades-server-*.tar.gz
            sHades-server-*.sha256
          retention-days: 7
