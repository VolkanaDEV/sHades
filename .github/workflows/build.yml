name: Build sHades Kivy client

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"

jobs:
  lint-and-test:
    name: lint + import test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y -qq libmtdev1 xvfb
      - name: Lint
        run: |
          python -m py_compile main.py kivy_client.py setup_sHades.py sHades.py ui_scale.py applet_bridge.py
          python -m flake8 main.py kivy_client.py setup_sHades.py sHades.py ui_scale.py applet_bridge.py
      - name: Import smoke test (headless)
        run: xvfb-run -a env KIVY_GL_BACKEND=mock python -c "import kivy_client; app = kivy_client.sHadesClientApp(); app.build(); print('client builds OK')"
      - name: Test suite
        run: |
          for t in tests/test_*.py; do
            echo "::group::$t"
            xvfb-run -a env KIVY_GL_BACKEND=mock python "$t" || { echo "::error::$t failed"; exit 1; }
            echo "::endgroup::"
          done

  build-linux:
    name: build Linux (PyInstaller onefile)
    needs: lint-and-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y -qq libmtdev1 xvfb
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0,<7.0"
      - name: Build onefile binary
        run: |
          xvfb-run -a env KIVY_GL_BACKEND=mock \
          pyinstaller --onefile --name sHades-client kivy_client.py \
            --hidden-import=RNS \
            --hidden-import=LXMF \
            --hidden-import=RNS.vendor \
            --hidden-import=RNS.vendor.umsgpack \
            --hidden-import=ui_scale \
            --collect-all=RNS \
            --collect-all=LXMF \
            --collect-all=wasmtime \
            --add-data "kv_md.kv:." \
            --add-data "media:media" \
            --distpath dist/linux
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: sHades-client-linux
          path: dist/linux/sHades-client
          retention-days: 7

  build-windows:
    name: build Windows (PyInstaller onefile)
    needs: lint-and-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0,<7.0"
      - name: Build onefile binary
        # --collect-all=wasmtime: the package ships a raw data DLL (wasmtime
        # layout: wasmtime/win32-x86_64/_wasmtime.dll) that plain analysis
        # never bundles; local mirror of this exact command produced an exe
        # with ZERO wasmtime entries in Analysis/EXE TOCs. Without it the
        # frozen client silently drops the micron applet bridge.
        run: pyinstaller --onefile --name sHades-client.exe kivy_client.py --hidden-import=RNS --hidden-import=LXMF --hidden-import=RNS.vendor --hidden-import=RNS.vendor.umsgpack --hidden-import=ui_scale --collect-all=RNS --collect-all=LXMF --collect-all=wasmtime --add-data "kv_md.kv;." --add-data "media;media" --distpath dist/windows
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: sHades-client-windows
          path: dist/windows/sHades-client.exe
          retention-days: 7

  build-android:
    name: build Android debug APK (buildozer)
    needs: lint-and-test
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17 (required by Android Gradle plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Clean buildozer cache
        run: |
          rm -rf ~/.buildozer
      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y -qq \
            git zip unzip python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev cmake ninja-build
      - name: Install buildozer + deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt buildozer==1.5.0 cython
      - name: Install gettext (autopoint needed by liblzma recipe)
        # p4a's liblzma recipe runs `autoreconf -vif` on the xz sources;
        # xz's configure.ac uses gettext, so autoreconf invokes autopoint.
        # GitHub's ubuntu runner image does NOT ship autopoint ("Can't
        # exec \"autopoint\": No such file or directory" -- android job
        # 132549200820, v0.5 first attempt). gettext installs it.
        run: sudo apt-get update -qq && sudo apt-get install -y gettext
      - name: Build debug APK
        # p4a version selection: Recipe.version reads VERSION_<name> env
        # (pythonforandroid/recipe.py). Kivy 2.3.1 supports python 3.8-3.13
        # while p4a develop's python3/hostpython3 recipe defaults jumped to
        # 3.14.2 -- so the build selects 3.11.5 (recipe-patched for it)
        # without pinning the whole toolchain to a stale commit.
        env:
          VERSION_python3: 3.11.5
          VERSION_hostpython3: 3.11.5
        run: |
          buildozer android debug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: sHades-client-android
          path: bin/*.apk
          retention-days: 7
